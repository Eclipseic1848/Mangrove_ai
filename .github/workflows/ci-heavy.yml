name: heavy-ci-manual

on:
  workflow_dispatch:
    inputs:
      gate:
        description: 选择本次人工重门
        required: true
        type: choice
        options:
          - full-regression
          - g1-frozen-contracts
          - docker-build
          - dependency-groups

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  python-heavy:
    if: inputs.gate == 'full-regression' || inputs.gate == 'g1-frozen-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-collectors.txt
            requirements-dev.txt
            requirements-evaluation.txt
      - name: 安装核心回归所需 Python 依赖组
        run: |
          set -euo pipefail
          mkdir -p .artifacts/heavy
          python -m pip install --disable-pip-version-check \
            -r requirements.txt \
            -r requirements-collectors.txt \
            -r requirements-dev.txt \
            -r requirements-evaluation.txt \
            2>&1 | tee .artifacts/heavy/python-install.log
          python -m pip check 2>&1 | tee .artifacts/heavy/pip-check.log
      - name: 运行所选 Python 重门
        run: |
          set -euo pipefail
          if [[ "${{ inputs.gate }}" == "g1-frozen-contracts" ]]; then
            python -m pytest -q tests/test_g1_*.py --junitxml=.artifacts/heavy/g1-contracts.xml
          else
            python -m pytest --junitxml=.artifacts/heavy/python-full.xml
          fi
      - name: 验证测试端口无残留
        if: always()
        run: |
          set -euo pipefail
          if ss -ltn | grep -Eq ':(4173|8088|18089)[[:space:]]'; then
            echo "测试端口仍被占用" >&2
            exit 1
          fi
      - name: 上传 Python 重门证据
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: python-${{ inputs.gate }}-evidence
          path: .artifacts/heavy
          if-no-files-found: warn
          retention-days: 14

  dependency-group-check:
    if: inputs.gate == 'dependency-groups'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: runtime
            requirements: requirements.txt
          - group: collectors
            requirements: requirements-collectors.txt
          - group: dev
            requirements: requirements-dev.txt
          - group: evaluation
            requirements: requirements-evaluation.txt
          - group: gpu
            requirements: requirements-gpu.txt
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            ${{ matrix.requirements }}
            requirements.txt
      - name: 独立安装依赖组
        run: |
          set -euo pipefail
          evidence_dir=".artifacts/dependency-groups/${{ matrix.group }}"
          mkdir -p "${evidence_dir}"
          install_args=(-r requirements.txt)
          if [[ "${{ matrix.group }}" != "runtime" ]]; then
            install_args+=(-r "${{ matrix.requirements }}")
          fi
          python -m pip install "${install_args[@]}" \
            2>&1 | tee "${evidence_dir}/install.log"
          python -m pip check 2>&1 | tee "${evidence_dir}/pip-check.log"
          python scripts/ci/check_dependency_group_imports.py --group "${{ matrix.group }}" \
            | tee "${evidence_dir}/import-smoke.json"
      - name: 上传依赖组证据
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dependency-${{ matrix.group }}-evidence
          path: .artifacts/dependency-groups/${{ matrix.group }}
          if-no-files-found: warn
          retention-days: 14

  frontend-e2e:
    if: inputs.gate == 'full-regression'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装并构建前端
        run: |
          set -euo pipefail
          mkdir -p ../.artifacts/heavy
          npm ci 2>&1 | tee ../.artifacts/heavy/frontend-install.log
          npm run build 2>&1 | tee ../.artifacts/heavy/frontend-build.log
      - name: 运行浏览器完整回归
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: ../.artifacts/heavy/frontend-e2e.xml
        run: npm run test:e2e -- --reporter=junit
      - name: 验证浏览器子进程和端口无残留
        if: always()
        run: |
          set -euo pipefail
          if ss -ltn | grep -Eq ':4173[[:space:]]' || pgrep -f '[v]ite.*4173'; then
            echo "浏览器测试子进程或端口仍有残留" >&2
            exit 1
          fi
      - name: 上传前端重门证据
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: frontend-e2e-evidence
          path: .artifacts/heavy
          if-no-files-found: warn
          retention-days: 14

  docker-heavy:
    if: inputs.gate == 'docker-build'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: 构建隔离验收镜像
        run: |
          set -euo pipefail
          mkdir -p .artifacts/heavy
          docker build --file docker/phase4b/Dockerfile --tag mangrove-heavy-ci:${{ github.sha }} . 2>&1 | tee .artifacts/heavy/docker-build.log
      - name: 上传 Docker 重门证据
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: docker-build-evidence
          path: .artifacts/heavy
          if-no-files-found: warn
          retention-days: 14
