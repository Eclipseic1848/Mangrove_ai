[pytest]
# Phase 0 统一测试基线（plan 4.3）
# - testpaths：tests/ 标准测试目录 + scripts/ 下 test_*.py 脚本式测试
# - 标准库断言风格，无需额外插件
# - 中文输出依赖根 conftest.py 的 UTF-8 重配
# - pytest-randomly 保留测试顺序随机化；关闭逐用例重播种，规避 Thinc 随机入口未裁剪 32 位种子的兼容问题
testpaths = tests scripts
python_files = test_*.py
python_functions = test_*
python_classes = Test*
markers =
    performance: 大规模性能测试，默认跳过（--run-performance 显式开启）
    db_live: 需要真实 MySQL/PG 连接的测试，默认跳过（--run-db-live + DSN 环境变量开启）
addopts =
    -ra
    --strict-markers
    -p no:cacheprovider
    --randomly-dont-reset-seed
filterwarnings =
    ignore::DeprecationWarning
