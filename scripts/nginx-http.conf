# 专用 Mangrove 入口；可替换部署手册中的 mangrove-public.conf。
# 使用前先按 docs/deployment/service-unavailable-page.md 安装独立故障页。
server {
    listen 80;
    # 将 PUBLIC_IP 替换为实际公网 IP；也可在同一行追加内网 IP。
    server_name PUBLIC_IP;
    client_max_body_size 520m;
    server_tokens off;
    error_page 502 503 504 /__mangrove_service_unavailable.html;

    location = /__mangrove_service_unavailable.html {
        internal;
        alias /var/www/mangrove-errors/service-unavailable.html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
    }

    location = /__mangrove_api_unavailable.json {
        internal;
        alias /var/www/mangrove-errors/service-unavailable.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location ~ /\. { return 404; }

    # Vite 带摘要的资源更新后会换地址，可长期缓存；接口仍按原规则代理。
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(js|css|woff2?)$" {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering on;
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 5;
        gzip_types application/javascript text/javascript text/css;
        expires 1y;
    }

    location ^~ /api/ {
        # 接口保留应用原始错误；网关断连也返回 JSON，避免维护页混入业务数据。
        error_page 502 503 504 /__mangrove_api_unavailable.json;
        proxy_intercept_errors off;
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_intercept_errors on;
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
