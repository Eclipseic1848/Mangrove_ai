<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>系统正在维护升级中 · Mangrove</title>
  <style>
    /* 沿用前端基础色；服务异常时不依赖应用或外部资源。 */
    :root { color-scheme: light; --background: 180 25% 99%; --foreground: 200 18% 14%; --primary: 173 80% 27%; --muted: 200 10% 44%; --border: 195 16% 89%; }
    * { box-sizing: border-box; }
    body { margin: 0; background: hsl(var(--background)); color: hsl(var(--foreground)); font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    .layout { width: min(100% - 48px, 1120px); min-height: 100vh; min-height: 100svh; margin: auto; display: flex; flex-direction: column; }
    header { padding: 32px 0; border-bottom: 1px solid hsl(var(--border)); }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 650; letter-spacing: -.5px; }
    .brand svg { color: hsl(var(--primary)); }
    main { flex: 1; display: flex; align-items: center; padding: 72px 0; }
    .message { max-width: 540px; }
    .status { display: inline-flex; align-items: center; gap: 8px; color: hsl(var(--muted)); font-size: 14px; }
    .status::before { content: ""; width: 8px; height: 8px; border: 2px solid hsl(var(--primary)); border-radius: 50%; }
    h1 { margin: 20px 0 16px; font-size: clamp(28px, 5vw, 42px); line-height: 1.3; font-weight: 650; letter-spacing: -1px; }
    p { margin: 0; color: hsl(var(--muted)); font-size: 16px; line-height: 1.8; }
    .retry { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 46px; margin-top: 32px; padding: 0 22px; border-radius: 10px; background: hsl(var(--primary)); color: white; text-decoration: none; font-size: 15px; font-weight: 600; }
    .retry:hover { background: hsl(173 80% 23%); }
    .retry:focus-visible { outline: 3px solid hsl(var(--primary)); outline-offset: 4px; }
    .help { margin-top: 24px; font-size: 13px; }
    footer { padding: 24px 0; border-top: 1px solid hsl(var(--border)); color: hsl(var(--muted)); font-size: 12px; }
    @media (max-width: 480px) { header { padding: 24px 0; } main { padding: 56px 0; } }
  </style>
</head>
<body>
  <div class="layout">
    <header><div class="brand"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 24V12M14 17C6 17 4 12 4 6c6 0 10 3 10 11ZM14 13c0-7 4-10 10-10 0 7-3 10-10 10ZM8 24h12"/></svg>Mangrove</div></header>
    <main>
      <section class="message" aria-labelledby="title">
        <div class="status">服务暂时暂停</div>
        <h1 id="title">系统正在维护升级中</h1>
        <p>暂时无法访问，请稍后重试。</p>
        <a class="retry" href=""><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"/></svg>重试</a>
        <p class="help">如果问题持续，请联系系统管理员。</p>
      </section>
    </main>
    <footer>Mangrove · 智能任务工作台</footer>
  </div>
</body>
</html>
