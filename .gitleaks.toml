title = "Mangrove Gitleaks configuration"
minVersion = "8.30.1"

[[allowlists]]
description = "已核实的删除幂等索引结构摘要，不是密钥；只匹配该字段的当前完整哈希"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^src/database_migrations/schema_manifest\.json$''']
regexes = ['''^\s*"index:ix_deletion_owner_key"\s*:\s*"febde8c09bf60d887f0e9de7a36189137ab6d6d5953feb2c9c831ff0717973e8"\s*,?\s*$''']

[extend]
useDefault = true

[[allowlists]]
description = "G4 资格账本锚点名称不是凭据"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^scripts/verify_g4_provider_safety\.py$''']
regexes = ['''QUALIFICATION_LEDGER_ANCHOR_KEY\s*=''']

[[allowlists]]
description = "G4 CLI 测试幂等键不是凭据"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^tests/test_g4_provider_safety_cli\.py$''']
regexes = ['''["']?idempotency_key["']?\s*(?:=|:)''']

[[allowlists]]
description = "冻结集文件名中的 token 单词不是凭据"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^evals/generalization-g1-independent/freeze\.json$''']
regexes = ['''sources/ih_safe_35_forbidden_token\.pdf''']

[[allowlists]]
description = "Schema manifest 中 Secret 表的 64 位值是结构摘要"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^src/database_migrations/schema_manifest\.json$''']
regexes = ['''"(?:model_connection_secrets|runtime_config_secrets)"\s*:\s*"[0-9a-f]{64}"''']

[[allowlists]]
description = "反馈审计表及不可变触发器的值是结构摘要"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^src/database_migrations/schema_manifest\.json$''']
regexes = ['''^\s*"(?:feedback_content_access|trigger:feedback_content_access_no_(?:delete|replace|update))"\s*:\s*"[0-9a-f]{64}"\s*,?\s*$''']

[[allowlists]]
description = "离线登录重定向测试的固定合成输入；仅豁免精确文件中的完整夹具行"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^tests/test_cookie_probe_feedback\.py$''']
# Gitleaks 的 line 保留前置换行；只兼容该边界字符，固定正文和缩进仍须完全一致。
regexes = ['''^\n?    with user_overrides_context\(\{key: "_m_h5_tk=synthetic_123"\}\):$''']
