title = "Mangrove Gitleaks configuration"
minVersion = "8.30.1"

[extend]
useDefault = true

[[allowlists]]
description = "G4 资格账本锚点名称不是凭据"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^scripts/verify_g4_provider_safety\.py$''']
regexes = ['''QUALIFICATION_LEDGER_ANCHOR_KEY\s*=''']

[[allowlists]]
description = "G4 CLI 测试幂等键不是凭据"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^tests/test_g4_provider_safety_cli\.py$''']
regexes = ['''["']?idempotency_key["']?\s*(?:=|:)''']

[[allowlists]]
description = "冻结集文件名中的 token 单词不是凭据"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^evals/generalization-g1-independent/freeze\.json$''']
regexes = ['''sources/ih_safe_35_forbidden_token\.pdf''']

[[allowlists]]
description = "Schema manifest 中 Secret 表的 64 位值是结构摘要"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^src/database_migrations/schema_manifest\.json$''']
regexes = ['''"(?:model_connection_secrets|runtime_config_secrets)"\s*:\s*"[0-9a-f]{64}"''']
